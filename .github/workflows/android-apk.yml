name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Without this, Gradle silently falls back to the debug key and the
      # published "release" APK isn't a real release. Fail loudly instead.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — refusing to publish a debug-signed 'release' APK. See android/key.properties.example."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/nexo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../nexo-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish pre-release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Nexo APK (latest)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: false
