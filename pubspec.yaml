name: nexo
description: Nexo - personal finance app
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2
  fl_chart: ^0.69.2
  dynamic_color: ^1.8.1
  sqlite3: ^3.3.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5
  path: ^1.9.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  # PDF rasterization (pdfium) — render statement pages to images for the AI
  # vision pipeline. Apache-2.0; avoids commercial-license PDF text extractors.
  pdfx: ^2.6.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.3
  cloud_firestore: ^5.6.12
  firebase_analytics: ^11.4.5
  flutter_gemma: ^0.16.0
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

# Build-hook config: compile/download SQLCipher instead of stock SQLite so the
# local DB can be encrypted at rest (see lib/core/db/local_store.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
